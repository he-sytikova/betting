name: Update forecasts for model development only

on:
  workflow_dispatch:
  push:
    branches:
      - model-development
    paths:
      - "scripts/build-data.js"
      - "scripts/euro365.js"
      - ".github/workflows/update-forecasts-development.yml"

permissions:
  contents: write

concurrency:
  group: update-forecasts-model-development
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout model-development only
        uses: actions/checkout@v5
        with:
          ref: model-development
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check scripts/build-data.js
          node --check scripts/euro365.js
      - name: Build current forecasts
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          SSTATS_TOKEN: ${{ secrets.SSTATS_TOKEN }}
          EURO365_API_KEY: ${{ secrets.EURO365_API_KEY }}
          FD_DATA_TOKEN: ${{ secrets.FD_DATA_TOKEN }}
        run: node scripts/build-data.js
      - name: Commit development data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No development data changes"
          else
            git commit -m "chore: refresh model development forecasts"
            git pull --rebase origin model-development
            git push origin HEAD:model-development
          fi
