name: Model development checks

on:
  push:
    branches:
      - model-development
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy scipy scikit-learn

      - name: Compile prediction scripts
        run: python -m compileall -q scripts/predictions

      - name: Run market-line unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
