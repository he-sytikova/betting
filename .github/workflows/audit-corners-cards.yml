name: Audit corners and yellow-card data

on:
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * 1'

permissions:
  contents: write

concurrency:
  group: corners-cards-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit public statistics coverage
        run: python scripts/predictions/audit-data.py

      - name: Publish audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corners_cards_audit.json
          if git diff --cached --quiet; then
            echo "Audit report has no changes"
          else
            git commit -m "chore: refresh corners and cards data audit"
            git pull --rebase origin main
            git push
          fi
