name: Update and publish football forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'markets.html'
      - 'markets.js'
      - 'data/corners_cards_models.json'
      - 'styles.css'
      - 'scripts/**'
      - '.github/workflows/update-forecasts.yml'

permissions:
  contents: write

concurrency:
  group: update-forecasts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check markets.js
          node --check scripts/build-data.js
          node --check scripts/euro365.js

      # Rebuild the published snapshot whenever the workflow is updated.
      - name: Check API secrets
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          SSTATS_TOKEN: ${{ secrets.SSTATS_TOKEN }}
          EURO365_API_KEY: ${{ secrets.EURO365_API_KEY }}
          FD_DATA_TOKEN: ${{ secrets.FD_DATA_TOKEN }}
        run: |
          if [ -z "$BSD_TOKEN" ] && [ -z "$SSTATS_TOKEN" ] && [ -z "$EURO365_API_KEY" ] && [ -z "$FD_DATA_TOKEN" ]; then
            echo "Add at least one API key in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Build today's forecasts
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          SSTATS_TOKEN: ${{ secrets.SSTATS_TOKEN }}
          EURO365_API_KEY: ${{ secrets.EURO365_API_KEY }}
          FD_DATA_TOKEN: ${{ secrets.FD_DATA_TOKEN }}
        run: node scripts/build-data.js

      - name: Commit data snapshot for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update football forecasts"
            git pull --rebase origin main
            git push
          fi

      # Wake the dev repository after every successful snapshot build.
      # GitHub silently skips a large share of scheduled runs in betting-dev,
      # so the dev refresh is triggered by dispatch (queued instantly) instead
      # of relying on its own schedule. The dev side waits inside the run for
      # the 07:01:30 Moscow game-day boundary before flipping the snapshot.
      - name: Wake the dev repository (betting-dev refresh)
        env:
          DEV_DISPATCH_TOKEN: ${{ secrets.DEV_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DEV_DISPATCH_TOKEN" ]; then
            echo "::warning::DEV_DISPATCH_TOKEN is not set; skipping dev wake-up"
            exit 0
          fi
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer $DEV_DISPATCH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/he-sytikova/betting-dev/actions/workflows/refresh-dev-fixtures.yml/dispatches"             -d '{"ref":"main"}'             || { echo "::warning::dev wake-up dispatch failed"; exit 0; }
          echo "Dispatched betting-dev refresh"
