name: Train independent goal markets model (development only)

on:
  workflow_dispatch:
  push:
    branches:
      - model-development
    paths:
      - "scripts/predictions/build-dataset.py"
      - "scripts/predictions/train-goals-markets.py"
      - ".github/workflows/train-goals-markets.yml"

permissions:
  contents: write

concurrency:
  group: goals-markets-development
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: model-development
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install model dependencies
        run: python -m pip install --upgrade pip numpy scipy scikit-learn
      - name: Build leakage-safe historical dataset
        run: python scripts/predictions/build-dataset.py
      - name: Train independent goal models and derive-market parameters
        run: python scripts/predictions/train-goals-markets.py
      - name: Validate exported model and report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          model=json.loads(Path("data/goals_markets_models.json").read_text())
          report=json.loads(Path("data/goals_markets_report.json").read_text())
          assert model["status"] == "experimental_research_model"
          assert model["models"]["homeGoals"]["coefficients"]
          assert model["models"]["awayGoals"]["coefficients"]
          assert report["markets"]["homeGoals"]["rows"] > 0
          assert report["markets"]["awayGoals"]["rows"] > 0
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Commit outputs to model-development only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corners_cards_training.csv data/goals_markets_models.json data/goals_markets_report.json
          git commit -m "model: train independent goal markets on development branch" || echo "No changes to commit"
          git pull --rebase origin model-development
          git push origin HEAD:model-development
      - uses: actions/upload-artifact@v4
        with:
          name: goals-markets-model-report
          path: data/goals_markets_report.json
          retention-days: 30
