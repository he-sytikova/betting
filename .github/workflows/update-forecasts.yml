name: Build and deploy football forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'scripts/**'
      - '.github/workflows/update-forecasts.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/build-data.js
          node --check scripts/euro365.js

      - name: Build today's forecasts
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          SSTATS_TOKEN: ${{ secrets.SSTATS_TOKEN }}
          EURO365_API_KEY: ${{ secrets.EURO365_API_KEY }}
          FD_DATA_TOKEN: ${{ secrets.FD_DATA_TOKEN }}
        run: node scripts/build-data.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
