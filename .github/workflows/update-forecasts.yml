name: Update and publish football forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'scripts/**'
      - '.github/workflows/update-forecasts.yml'

permissions:
  contents: write

concurrency:
  group: update-forecasts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/build-data.js
          node --check scripts/euro365.js

      # Rebuild the published snapshot whenever the workflow is updated.
      - name: Check API secrets
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          SSTATS_TOKEN: ${{ secrets.SSTATS_TOKEN }}
          EURO365_API_KEY: ${{ secrets.EURO365_API_KEY }}
          FD_DATA_TOKEN: ${{ secrets.FD_DATA_TOKEN }}
        run: |
          if [ -z "$BSD_TOKEN" ] && [ -z "$SSTATS_TOKEN" ] && [ -z "$EURO365_API_KEY" ] && [ -z "$FD_DATA_TOKEN" ] && [ -z "$API_FOOTBALL_KEY" ]; then
            echo "Add at least one API key in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Build today's forecasts
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          SSTATS_TOKEN: ${{ secrets.SSTATS_TOKEN }}
          EURO365_API_KEY: ${{ secrets.EURO365_API_KEY }}
          FD_DATA_TOKEN: ${{ secrets.FD_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/build-data.js

      - name: Commit data snapshot for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update football forecasts"
            git pull --rebase origin main
            git push
          fi
