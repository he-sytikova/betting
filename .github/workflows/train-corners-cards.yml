name: Build and backtest corners and cards models

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corners-cards-model
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install model dependencies
        run: python -m pip install --upgrade pip numpy scipy scikit-learn

      - name: Refresh data eligibility audit
        run: python scripts/predictions/audit-data.py

      - name: Build leakage-safe historical dataset
        run: python scripts/predictions/build-dataset.py

      - name: Train, calibrate and evaluate total lines
        run: python scripts/predictions/train-models.py

      - name: Create compact walk-forward summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/corners_cards_model_report.json").read_text(encoding="utf-8"))
          summary = {
              "generatedAt": report.get("generatedAt"),
              "datasetRows": report.get("datasetRows"),
              "method": "Expanding-window seasonal walk-forward; refit each fold using only earlier matches",
              "markets": {}
          }
          for market in ("corners", "yellowCards"):
              walk = report.get(market, {}).get("walkForward", {})
              summary["markets"][market] = {
                  "status": walk.get("status"),
                  "evaluatedFolds": walk.get("evaluatedFolds", 0),
                  "pooledTestRows": walk.get("pooledTestRows", 0),
                  "folds": [
                      {
                          "seasonStart": fold.get("seasonStart"),
                          "seasonEndExclusive": fold.get("seasonEndExclusive"),
                          "status": fold.get("status"),
                          "trainRows": fold.get("trainRows"),
                          "testRows": fold.get("testRows"),
                          "trainThrough": fold.get("trainThrough"),
                          "testFrom": fold.get("testFrom"),
                          "testThrough": fold.get("testThrough"),
                          "negativeBinomialAlpha": fold.get("negativeBinomialAlpha"),
                          "pointMetrics": fold.get("pointMetrics"),
                      }
                      for fold in walk.get("folds", [])
                  ],
                  "pooledComparisons": walk.get("pooledComparisons", []),
                  "coefficientStability": walk.get("coefficientStability", {}),
                  "significanceLevel": walk.get("significanceLevel"),
                  "interpretation": walk.get("interpretation"),
              }
          Path("data/walk-forward-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print("Created data/walk-forward-summary.json")
          PY

      - name: Publish dataset and backtest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/corners_cards_model_report.json").read_text(encoding="utf-8"))
          for market in ("corners", "yellowCards"):
              nb = report.get(market, {}).get("negativeBinomial", {})
              if nb.get("status") != "evaluated" or not nb.get("totalLines"):
                  raise SystemExit(f"Missing Negative Binomial results for {market}")
          print("Validated Poisson and Negative Binomial report sections")
          PY
          git add data/corners_cards_audit.json data/corners_cards_training.csv
          git add -f data/corners_cards_model_report.json data/walk-forward-summary.json
          git commit -m "chore: refresh corners and cards audit and training outputs" || echo "No changes to commit"
          git pull --rebase origin main
          git push

      - name: Upload compact walk-forward summary
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-summary
          path: data/walk-forward-summary.json
          if-no-files-found: error
          retention-days: 30
