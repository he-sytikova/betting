name: Build and backtest corners and cards models

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corners-cards-model
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install model dependencies
        run: python -m pip install --upgrade pip numpy scikit-learn

      - name: Refresh data eligibility audit
        run: python scripts/predictions/audit-data.py

      - name: Build leakage-safe historical dataset
        run: python scripts/predictions/build-dataset.py

      - name: Train and evaluate Poisson baselines
        run: python scripts/predictions/train-models.py

      - name: Publish dataset and backtest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corners_cards_training.csv data/corners_cards_model_report.json
          git commit -m "chore: build corners and cards training dataset" || echo "No changes to commit"
          git pull --rebase origin main
          git push
